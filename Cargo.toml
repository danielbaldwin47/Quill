[workspace]
resolver = "3"
members = ["quill", "quill-engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Whatever gtk4-rs pins; raise this only when gtk4-rs does.
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/danielbaldwin47/Quill"
publish = false

[workspace.dependencies]
quill-engine = { path = "quill-engine" }
# `gtk` belongs to the app crate alone (ADR 0008); the engine must stay
# buildable and testable with no display attached.
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
# The model and its provenance are pinned together (ADR 0018).
harper-brill = "=2.8.0"
# `pdf` is the surface Export writes a file on and `v1_16` what puts the
# document metadata and the heading bookmarks on it (`docs/architecture.md`
# § Preview and Export); the app crate reaches the same crate through `gtk`.
cairo-rs = { version = "0.22", features = ["pdf", "v1_16"] }
notify = "8"
# `notify` 8 has no debouncer of its own, and a save is never one event: an
# editor writes a temporary file and renames it over the top, as Quill's own
# `settings::file::write` does. The mini debouncer is the one that gathers a
# run of events per path into one, which is all the settings watch asks of it.
notify-debouncer-mini = "0.7"
pango = "0.22"
pangocairo = "0.22"
# `default-features = false` drops `getopts`, which serves the crate's own
# binary and nothing here. `html` is on because Export reads it: the Editor
# styles from the byte ranges `into_offset_iter()` reports and never builds a
# document, but HTML export is — `docs/architecture.md` § Preview and Export —
# "the parser's HTML plus the CSS the Template generates", and
# `quill_engine::html` writes the first half through `html::push_html`.
pulldown-cmark = { version = "0.13", default-features = false, features = [
    "html",
] }
serde = { version = "1", features = ["derive"] }
# `preserve_order`: a settings file is written in the order
# `docs/architecture.md` names its keys, and a key a newer Quill added keeps
# its place, rather than everything landing in alphabetical order.
toml = { version = "0.9", features = ["preserve_order"] }

[workspace]
resolver = "3"
members = ["quill", "quill-engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Whatever gtk4-rs pins; raise this only when gtk4-rs does.
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/danielbaldwin47/Quill"
publish = false

[workspace.dependencies]
quill-engine = { path = "quill-engine" }
# `gtk` belongs to the app crate alone (ADR 0008); the engine must stay
# buildable and testable with no display attached.
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
cairo-rs = "0.22"
notify = "8"
pango = "0.22"
# `default-features = false` drops `getopts`, which serves the crate's own
# binary and nothing here, and `html`, its renderer: the Editor styles from the
# byte ranges `into_offset_iter()` reports and never builds a document. HTML
# export does — `docs/architecture.md` § Preview and Export is "the parser's
# HTML plus the CSS the Template generates" — so the ticket that lands Export
# turns `html` back on. It is off until something reads it.
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
# `preserve_order`: a settings file is written in the order
# `docs/architecture.md` names its keys, and a key a newer Quill added keeps
# its place, rather than everything landing in alphabetical order.
toml = { version = "0.9", features = ["preserve_order"] }

[package]
name = "quill-engine"
description = "Quill's display-free half: text model, Markdown, Annotators, Library, settings, Templates, rendering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No `gtk` here, ever: the engine/UI boundary is held by Cargo rather than by
# convention (ADR 0008), and `tests/boundary.rs` fails the build if it slips.
[dependencies]
harper-brill.workspace = true
cairo-rs.workspace = true
notify.workspace = true
notify-debouncer-mini.workspace = true
# `v1_50` is the absolute line height a rendered page's leading is set with,
# which the app crate gets for free through `gtk`'s own Pango feature and this
# crate, built and tested on its own, has to ask for.
pango = { workspace = true, features = ["v1_50"] }
# Pango lays a rendered page out (`render`), and `pangocairo` is what reads the
# resolution a context draws at and what gives a test a context with no display
# behind it. Neither is a widget, which is the whole of ADR 0008's rule.
pangocairo.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
toml.workspace = true

# The keystroke bench: `cargo bench -p quill-engine`. Informational, so it
# carries no dependency and no harness — `std::time::Instant` around the call
# the keystroke path makes is the whole of it.
[[bench]]
name = "keystroke"
harness = false

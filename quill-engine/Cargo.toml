[package]
name = "quill-engine"
description = "Quill's display-free half: text model, Markdown, Annotators, Library, settings, Templates, rendering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# No `gtk` here, ever: the engine/UI boundary is held by Cargo rather than by
# convention (ADR 0008), and `tests/boundary.rs` fails the build if it slips.
[dependencies]
cairo-rs.workspace = true
notify.workspace = true
notify-debouncer-mini.workspace = true
pango.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
toml.workspace = true

# The keystroke bench: `cargo bench -p quill-engine`. Informational, so it
# carries no dependency and no harness — `std::time::Instant` around the call
# the keystroke path makes is the whole of it.
[[bench]]
name = "keystroke"
harness = false

# Classic: the Serif, on Source Serif 4.
#
# The book setting: paragraphs indented rather than spaced.
#
# The dark page has now been captured beside State 16's:
# `ref/ia/mac-native/CAPTURE-2026-09-09.md` § "#261 — Preview", off
# `mac-native-20-dark-preview-classic-full`, reads #101010 paper on #cccccc
# ink, which is what [dark] already held. The light page was captured in
# neither scheme, so the #ffffff below is still iA's own description of the
# template rather than a measurement, and stays until one lands.
#
# That capture's rhythm is a rendered state and not the template's numbers:
# body line pitch 68 px at backing scale 2, the first paragraph's lines at
# y345/413/481/549/617 and the next paragraph at y750, so a paragraph advances
# by about two pitches there. Neither number below moves for it. A pitch is
# base × line_height and one still separates neither factor; the still records
# no first-line indent either, so it cannot say whether that gap belongs to a
# spaced setting or stands beside an indent, which is the one reading that
# would bear on the paragraph_spacing here (`VERDICTS.md` § 4.3.5).

id = "classic"
paragraphs = "indented"

[faces]
body = { family = "Source Serif 4" }
heading = { family = "Source Serif 4" }
code = { family = "Quill Mono", italic = "Quill Mono Italic" }

[sizes]
base = 17.0
headings = [1.9, 1.5, 1.25, 1.125, 1.0, 1.0]
code = 0.85

# An indented Template names no space between paragraphs: the indent is what
# marks the break, and the two together would mark it twice.
[rhythm]
line_height = 1.55
measure = 32.0
paragraph_spacing = 0.0
space_before_heading = 1.75
space_after_heading = 0.5

[headings]
weight = 700

[light]
paper = "#ffffff"
ink = "#191919"
muted = "#8c8c8c"
link = "#1a5fb4"
code_ground = "#f0f0f0"

[dark]
paper = "#101010"
ink = "#cccccc"
muted = "#7e7e7e"
link = "#78aeed"
code_ground = "#1c1c1c"

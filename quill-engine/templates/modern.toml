# Modern: the Sans, on Inter. The default Template.
#
# The papers and the inks are measured, not chosen. The dark page is
# `dev/ref/ia/mac-native/NOTES.md` § State 16: #101010, a step darker than the
# Editor's own #1a1a1a. The light page is `dev/ref/ia/mac-native/CAPTURE-2026-09-09.md`
# § "#261 — Preview", off `mac-native-20-light-preview-modern-full` and
# `-split`: #fcfcfc paper carrying #1a1a1a ink. It is not the white this file
# assumed while that capture was outstanding, and its ink is not the Editor's
# own #191919 either. Both are neutrals, and that capture's § Rig and
# provenance is careful about what that buys: its normalised Editor neutrals
# matched the earlier rig exactly while two chromatic values did not, and an
# Editor-role colour check is not a Preview validation, so these two are read
# off the frames rather than passed by it.

id = "modern"
paragraphs = "spaced"

[faces]
body = { family = "Inter" }
heading = { family = "Inter" }
code = { family = "Quill Mono", italic = "Quill Mono Italic" }

[sizes]
base = 16.0
headings = [2.0, 1.5, 1.25, 1.125, 1.0, 1.0]
code = 0.9

[rhythm]
line_height = 1.5
measure = 34.0
paragraph_spacing = 1.0
space_before_heading = 1.75
space_after_heading = 0.5

[headings]
weight = 700

# The dark ink is the Editor's own (`theme.rs`, `Colours::DARK`), and the
# capture agrees with it at #cccccc. The light ink is not: the same capture
# reads #1a1a1a where the Editor sets #191919, so a rendered light page is a
# step off the Editor's ink as well as on a different paper. The code ground
# is the Editor's wash flattened onto this Template's paper, and the link is a
# blue rather than the Editor's grey rule: a rendered link is read, not typed
# over. Neither the code ground, nor the link, nor either muted ink was
# captured in any scheme.

[light]
paper = "#fcfcfc"
ink = "#1a1a1a"
muted = "#8c8c8c"
link = "#1a5fb4"
code_ground = "#f0f0f0"

[dark]
paper = "#101010"
ink = "#cccccc"
muted = "#7e7e7e"
link = "#78aeed"
code_ground = "#1c1c1c"
